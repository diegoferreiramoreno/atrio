name: CI

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/api/Atrio.slnx

      - name: Build solution
        run: dotnet build apps/api/Atrio.slnx --no-restore

      - name: Run tests (Architecture & Integration with Testcontainers)
        run: dotnet test apps/api/Atrio.slnx --no-build

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck
        run: npm --prefix apps/web run typecheck

      - name: Run unit & component tests
        run: npm --prefix apps/web test -- --run

      - name: Build SPA
        run: npm --prefix apps/web run build

  containers-smoke:
    name: Container Build & Smoke Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start development stack
        run: docker compose up -d --build

      - name: Wait for services and execute smoke tests
        run: |
          chmod +x ./scripts/smoke.sh
          ./scripts/smoke.sh

      - name: Stop development stack
        if: always()
        run: docker compose down
