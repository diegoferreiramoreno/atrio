services:
  db:
    image: postgres:17-alpine
    container_name: atrio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atrio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_insecure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atrio}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atrio-api
    environment:
      ConnectionStrings__Atrio: Host=db;Port=5432;Database=${POSTGRES_DB:-atrio};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_insecure}
      Build__Version: ${BUILD_VERSION:-0.1.0-dev}
      Build__Commit: ${BUILD_COMMIT:-local}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: atrio-web
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: atrio-caddy
    profiles:
      - proxy
    ports:
      - "${CADDY_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
